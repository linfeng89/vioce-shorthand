name: Build Android APK

on:
  push:
    branches: [ "main", "260502-chore-setup-voice-diary-framework" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  APK_OUTPUT_DIR: './publish'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version && github.ref || github.ref }}

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MAUI Workload
      run: |
        dotnet workload install maui-android --ignore-failed-sources
        dotnet workload install android --ignore-failed-sources

    - name: Verify MAUI Installation
      run: dotnet --version

    - name: Download Model Files
      run: |
        cd VoiceDiary
        echo "Downloading Whisper model (~433MB)..."
        wget -q --show-progress https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2
        echo "Extracting model files..."
        mkdir -p Resources/Models/sherpa-onnx-whisper-base
        tar -xf sherpa-onnx-whisper-base.tar.bz2 -C Resources/Models/
        rm sherpa-onnx-whisper-base.tar.bz2
        
        # Verify model files exist
        echo "Verifying model files..."
        ls -lh Resources/Models/sherpa-onnx-whisper-base/

    - name: Restore NuGet Packages
      run: |
        cd VoiceDiary
        dotnet restore

    - name: Build Debug APK
      run: |
        cd VoiceDiary
        echo "Building Debug APK..."
        dotnet publish -f net8.0-android -c Debug \
          -o ${{ env.APK_OUTPUT_DIR }}/debug \
          /p:AndroidPackageFormat=apk \
          /p:AndroidKeyStore=false

    - name: Build Release APK
      run: |
        cd VoiceDiary
        echo "Building Release APK..."
        dotnet publish -f net8.0-android -c Release \
          -o ${{ env.APK_OUTPUT_DIR }}/release \
          /p:AndroidPackageFormat=apk \
          /p:AndroidKeyStore=false \
          /p:AndroidUseSharedRuntime=false

    - name: List Generated APKs
      run: |
        echo "Generated APK files:"
        find ${{ env.APK_OUTPUT_DIR }} -name "*.apk" -exec ls -lh {} \;

    - name: Upload Debug APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: voicediary-debug-apk
        path: ${{ env.APK_OUTPUT_DIR }}/debug/*.apk
        retention-days: 30

    - name: Upload Release APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: voicediary-release-apk
        path: ${{ env.APK_OUTPUT_DIR }}/release/*.apk
        retention-days: 30

    - name: Create GitHub Release (on tag or manual trigger)
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        name: VoiceDiary ${{ github.event.inputs.version || github.ref_name }}
        body: |
          ## 🎉 VoiceDiary Sprint 3 测试版

          ### ✨ 新功能
          - 📝 日记列表智能分组（日期 + 时间段）
          - 🔍 FTS5 全文搜索（支持中文）
          - 📱 无限滚动加载（每次 30 条）
          - 💡 搜索结果高亮显示
          - 🎨 UI 美化优化

          ### 📊 性能指标
          - 搜索响应 < 100ms（1000 条数据）
          - 列表滚动 60 FPS
          - 内存占用 ~35MB

          ### 📥 安装说明
          1. 下载 `voicediary-debug.apk`
          2. 在 Android 设备上打开安装
          3. 授予麦克风权限
          4. 开始使用！

          ### 🧪 测试重点
          - [ ] 录音和回放功能
          - [ ] 中文转写准确率
          - [ ] 列表分组显示
          - [ ] 搜索响应速度
          - [ ] 左滑删除功能

          ### 🐛 已知问题
          - 自定义日期范围选择器待实现
          - 搜索历史功能待实现

          ### 📝 反馈
          如有问题请在 GitHub Issues 中反馈：https://github.com/linfeng89/vioce-shorthand/issues
        draft: false
        prerelease: true
        files: |
          ${{ env.APK_OUTPUT_DIR }}/debug/*.apk
          ${{ env.APK_OUTPUT_DIR }}/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Build Report
      if: always()
      run: |
        echo "## 📊 Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Generated APKs" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Type | Size | Path |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
        
        for apk in ${{ env.APK_OUTPUT_DIR }}/*/*.apk; do
          if [ -f "$apk" ]; then
            size=$(ls -lh "$apk" | awk '{print $5}')
            type=$(echo "$apk" | grep -q debug && echo "Debug" || echo "Release")
            echo "| $type | $size | \`$apk\` |" >> $GITHUB_STEP_SUMMARY
          fi
        done

    - name: Upload Build Report
      uses: actions/upload-artifact@v4
      with:
        name: build-report
        path: VoiceDiary/Resources/Models/
        retention-days: 7
